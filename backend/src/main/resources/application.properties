spring.application.name=clinica-agendamento

# conexao com o postgres (mesmos dados do docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica
spring.datasource.username=postgres
spring.datasource.password=postgres

# update -> o hibernate cria/atualiza as tabelas sozinho olhando as entidades
spring.jpa.hibernate.ddl-auto=update
# mostra no console os SQL que o hibernate ta rodando (bom pra mostrar na apresentacao)
spring.jpa.show-sql=true
