spring.application.name=clinica-agendamento

# Conexão com o PostgreSQL (o do docker-compose usa esses mesmos dados)
# o formato ${VAR:padrao} deixa trocar por variavel de ambiente se precisar
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# update = o Hibernate cria/ajusta as tabelas sozinho a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# endereço do Angular, liberado no CorsConfig
app.cors.origem=${CORS_ORIGEM:http://localhost:4200}
