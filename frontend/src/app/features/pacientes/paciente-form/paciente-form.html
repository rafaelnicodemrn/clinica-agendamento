<h1 class="h3 mb-3">{{ editando ? 'Editar paciente' : 'Novo paciente' }}</h1>

@if (erro()) {
  <div class="alert alert-danger">{{ erro() }}</div>
}

<form class="card shadow-sm" [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <div class="card-body row g-3">
    <div class="col-12">
      <label class="form-label" for="nome">Nome completo</label>
      <input id="nome" class="form-control" formControlName="nome" [class.is-invalid]="invalido('nome')" />
      <div class="invalid-feedback">Informe o nome (mínimo 3 caracteres).</div>
    </div>

    <div class="col-md-6">
      <label class="form-label" for="cpf">CPF (somente números)</label>
      <input
        id="cpf"
        class="form-control"
        formControlName="cpf"
        maxlength="11"
        inputmode="numeric"
        [class.is-invalid]="invalido('cpf')"
      />
      <div class="invalid-feedback">O CPF deve ter 11 dígitos.</div>
    </div>

    <div class="col-md-6">
      <label class="form-label" for="dataNascimento">Data de nascimento</label>
      <input
        id="dataNascimento"
        type="date"
        class="form-control"
        formControlName="dataNascimento"
        [max]="hoje"
        [class.is-invalid]="invalido('dataNascimento')"
      />
      <div class="invalid-feedback">Informe a data de nascimento.</div>
    </div>

    <div class="col-md-6">
      <label class="form-label" for="telefone">Telefone (DDD + número)</label>
      <input
        id="telefone"
        class="form-control"
        formControlName="telefone"
        maxlength="11"
        inputmode="numeric"
        [class.is-invalid]="invalido('telefone')"
      />
      <div class="invalid-feedback">Informe 10 ou 11 dígitos.</div>
    </div>

    <div class="col-md-6">
      <label class="form-label" for="email">E-mail</label>
      <input id="email" type="email" class="form-control" formControlName="email" [class.is-invalid]="invalido('email')" />
      <div class="invalid-feedback">Informe um e-mail válido.</div>
    </div>
  </div>

  <div class="card-footer d-flex justify-content-end gap-2">
    <a class="btn btn-outline-secondary" routerLink="/pacientes">Cancelar</a>
    <button class="btn btn-primary" type="submit" [disabled]="salvando()">Salvar</button>
  </div>
</form>
