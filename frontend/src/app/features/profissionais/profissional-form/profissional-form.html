<h1 class="h3 mb-3">{{ editando ? 'Editar profissional' : 'Novo profissional' }}</h1>

@if (erro()) {
  <div class="alert alert-danger">{{ erro() }}</div>
}

<form class="card shadow-sm" [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <div class="card-body row g-3">
    <div class="col-12">
      <label class="form-label" for="nome">Nome</label>
      <input id="nome" class="form-control" formControlName="nome" [class.is-invalid]="invalido('nome')" />
      <div class="invalid-feedback">Informe o nome (mínimo 3 caracteres).</div>
    </div>

    <div class="col-md-6">
      <label class="form-label" for="especialidade">Especialidade</label>
      <input
        id="especialidade"
        class="form-control"
        formControlName="especialidade"
        list="listaEspecialidades"
        [class.is-invalid]="invalido('especialidade')"
      />
      <datalist id="listaEspecialidades">
        @for (e of especialidades(); track e) {
          <option [value]="e"></option>
        }
      </datalist>
      <div class="invalid-feedback">Informe a especialidade.</div>
    </div>

    <div class="col-md-6">
      <label class="form-label" for="registro">Registro profissional (CRM)</label>
      <input id="registro" class="form-control" formControlName="registro" [class.is-invalid]="invalido('registro')" />
      <div class="invalid-feedback">Informe o registro (máximo 20 caracteres).</div>
    </div>

    <div class="col-md-8">
      <label class="form-label" for="email">E-mail</label>
      <input id="email" type="email" class="form-control" formControlName="email" [class.is-invalid]="invalido('email')" />
      <div class="invalid-feedback">Informe um e-mail válido.</div>
    </div>

    <div class="col-md-4 d-flex align-items-end">
      <div class="form-check form-switch">
        <input id="ativo" type="checkbox" class="form-check-input" formControlName="ativo" />
        <label class="form-check-label" for="ativo">Aceita agendamentos</label>
      </div>
    </div>
  </div>

  <div class="card-footer d-flex justify-content-end gap-2">
    <a class="btn btn-outline-secondary" routerLink="/profissionais">Cancelar</a>
    <button class="btn btn-primary" type="submit" [disabled]="salvando()">Salvar</button>
  </div>
</form>
